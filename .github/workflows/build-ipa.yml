name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # запуск вручную из вкладки Actions

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # Сборка без подписи: отключаем code signing целиком.
      - name: Build (no signing)
        run: |
          xcodebuild build \
            -project ios/PotRemote.xcodeproj \
            -scheme PotRemote \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS=""

      # Упаковываем .app в структуру Payload/ и зипуем в .ipa вручную.
      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos \
                     -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::.app не найден — сборка провалилась"
            exit 1
          fi
          echo "Найден: $APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r PotRemote-unsigned.ipa Payload > /dev/null
          echo "IPA собран:"
          ls -lh PotRemote-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PotRemote-unsigned-ipa
          path: build/PotRemote-unsigned.ipa
          retention-days: 14
