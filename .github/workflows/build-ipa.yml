name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Показываем, какие версии Xcode вообще есть на раннере,
      # и текущую выбранную. Если Xcode 26 в списке — выбираем его.
      - name: Select Xcode
        run: |
          echo "=== Доступные версии Xcode ==="
          ls /Applications | grep -i Xcode || true
          echo "=== Пытаемся выбрать Xcode 26, если он есть ==="
          if [ -d /Applications/Xcode_26.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          elif [ -d /Applications/Xcode_26.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app
          elif ls /Applications | grep -qi "Xcode_26"; then
            APP=$(ls /Applications | grep -i "Xcode_26" | head -n1)
            sudo xcode-select -s "/Applications/$APP"
          fi
          echo "=== Итоговая версия ==="
          xcodebuild -version
          echo "=== SDK ==="
          xcodebuild -showsdks | grep -i ios || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # Сборка без подписи. -quiet убран, ошибки печатаются полностью.
      # xcpretty не используем, чтобы не резать вывод error:.
      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/PotRemote.xcodeproj \
            -scheme PotRemote \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            2>&1 | tee build/xcodebuild.log

      # Если сборка упала — этот шаг соберёт все строки error: в один блок,
      # чтобы их было легко скопировать целиком.
      - name: Collect errors
        if: failure()
        run: |
          echo "======== СТРОКИ ОШИБОК (скопируйте этот блок) ========"
          grep -E "error:|warning: .*unavailable|is only available" build/xcodebuild.log | head -n 60 || true
          echo "======================================================"

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos \
                     -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::.app не найден — сборка провалилась"
            exit 1
          fi
          echo "Найден: $APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r PotRemote-unsigned.ipa Payload > /dev/null
          ls -lh PotRemote-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PotRemote-unsigned-ipa
          path: build/PotRemote-unsigned.ipa
          retention-days: 14

      # Полный лог сборки всегда доступен как артефакт — удобно прислать.
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/xcodebuild.log
          retention-days: 14
